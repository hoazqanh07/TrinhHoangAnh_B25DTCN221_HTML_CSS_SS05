<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dịch vụ nha khoa</title>
    <style>
        .services {
            background-color: #f4f4f9;
            padding: 30px;
            width: 80%;
            margin: 20px auto;
        }

        .services h2 {
            color: #1e90ff;
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .services p {
            text-align: center;
            margin-bottom: 20px;
        }

        .services ul {
            list-style-type: none;
            padding-left: 0;
        }

        .services li {
            margin: 10px 0;
            font-size: 18px;
        }

        .services .old {
            text-decoration: line-through;
        }

        .services .highlight {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <section class="services">
        <h2>Dịch Vụ</h2>
        <p>Khám và tư vấn răng miệng tổng quát</p>

        <ul>
            <li class="old">Trồng răng Implant</li>
            <li class="highlight">Niềng răng thẩm mỹ</li>
            <li>Tẩy trắng răng</li>
            <li>Điều trị viêm lợi, chảy máu chân răng</li>
        </ul>
    </section>

</body>
</html>
