<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form góp ý</title>
    <style>
        h2 {
            color: #1e90ff;
            text-align: center;
        }

        form {
            width: 400px;
            margin: auto;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #1e90ff;
        }

        button {
            background-color: #00bfff;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>Ý Kiến Phản Hồi tới Nha Sỹ</h2>

    <form>
        <label>Họ và tên:</label><br>
        <input type="text" placeholder="Nhập họ và tên"><br><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Nhập email của bạn"><br><br>

        <label>Phản hồi của bạn:</label><br>
        <textarea rows="4" placeholder="Nhập ý kiến của bạn..."></textarea><br><br>

        <button>Gửi ý kiến</button>
    </form>

</body>
</html>
